[package]
name = "markdown-docs"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = "0.58"
ammonia = "4"
rusqlite = { version = "0.41", features = ["bundled"] }
trash = "5"
notify = "8"
