[package]
name = "markdown-docs"
version = "0.5.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = "0.58"
ammonia = "4"
rusqlite = { version = "0.41", features = ["bundled"] }
trash = "5"
notify = "8"
percent-encoding = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFontManager"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFString"] }
