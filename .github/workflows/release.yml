# Builds the app for macOS (universal) and Linux and publishes them as one GitHub Release.
#
# Release:  bump "version" in src-tauri/tauri.conf.json, commit, then
#           git tag v<version> && git push origin v<version>
# Dry run:  Actions → Release → Run workflow (builds + uploads artifacts, publishes nothing)
#
# macOS signing/notarization turns on automatically when these repository secrets exist:
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
#
# In-app updates turn on when TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, if the key
# has one) exist: update files are signed and the release gets the latest.json the app checks. The matching
# public key is plugins.updater.pubkey in src-tauri/tauri.conf.json.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - os: ubuntu-24.04
            name: linux
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Read app version
        id: version
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" = "true" ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version ($v) in src-tauri/tauri.conf.json"
            exit 1
          fi

      - run: npm ci

      - name: Test
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Missing secrets arrive as empty strings; unset them so Tauri builds unsigned instead of failing.
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!k}" ]; then unset "$k"; fi
          done
          # Update files need the signing key, so local builds (and forks) leave them off.
          updater=()
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then updater=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); fi
          npx tauri build ${{ matrix.args }} "${updater[@]}"

      - name: Package
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir -p out
          case "${{ matrix.name }}" in
            macos)
              b=src-tauri/target/universal-apple-darwin/release/bundle
              cp "$b/dmg/Markdown Docs_${v}_universal.dmg" "out/Markdown-Docs_${v}_universal.dmg"
              ditto -c -k --keepParent "$b/macos/Markdown Docs.app" "out/Markdown-Docs_${v}_universal.app.zip"
              if [ -f "$b/macos/Markdown Docs.app.tar.gz.sig" ]; then
                cp "$b/macos/Markdown Docs.app.tar.gz" "out/Markdown-Docs_${v}_universal.app.tar.gz"
                cp "$b/macos/Markdown Docs.app.tar.gz.sig" "out/Markdown-Docs_${v}_universal.app.tar.gz.sig"
              fi
              lipo -archs "$b/macos/Markdown Docs.app/Contents/MacOS/markdown-docs"
              ;;
            linux)
              b=src-tauri/target/release/bundle
              cp "$b/deb/Markdown Docs_${v}_amd64.deb" "out/Markdown-Docs_${v}_amd64.deb"
              cp "$b/appimage/Markdown Docs_${v}_amd64.AppImage" "out/Markdown-Docs_${v}_amd64.AppImage"
              for f in deb/"Markdown Docs_${v}_amd64.deb" appimage/"Markdown Docs_${v}_amd64.AppImage"; do
                if [ -f "$b/$f.sig" ]; then cp "$b/$f.sig" "out/$(basename "$f" | tr ' ' '-').sig"; fi
              done
              ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markdown-docs-${{ steps.version.outputs.version }}-${{ matrix.name }}
          path: out/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          node .github/scripts/latest-json.mjs out "$v" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
          # Signatures are inside latest.json; they don't need to be release assets.
          mkdir -p sigs && find out -name '*.sig' -exec mv {} sigs/ \;
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Markdown Docs $v" \
            --notes-file .github/release-notes.md \
            --generate-notes
